    <div class="container-fluid">
        <div class="row justify-content-center">
            <div class="col-8">
                <h3 class="text-center">Quanti giorni ho fatto di assenza?</h3>
                <div class="input-group mb-3">
                    <input type="text" id="progresso" class="form-control" placeholder="Giorni" aria-label="Giorni" aria-describedby="button-addon2">
                    <button onclick="assenze()" class="btn btn-outline-secondary" type="button" id="button-addon2">Invia</button>
                </div>
            </div>
            <div class="col-8">
                <div class="progress" role="progressbar" aria-label="Animated striped example" aria-valuenow="75" aria-valuemin="0" aria-valuemax="100">
                    <div class="progress-bar progress-bar-striped progress-bar-animated" id="barra"></div>
                </div>
            </div>

            <div class="col-6">
                <h3 class="text-center">Calcolatrice</h3>

                <input type="number" id="num1" class="form-control mb-2" placeholder="Numero 1">

                <input type="number" id="num2" class="form-control mb-2" placeholder="Numero 2">

                <select id="operazione" class="form-select mb-2">
                    <option value="+">Somma (+)</option>
                    <option value="-">Sottrazione (-)</option>
                    <option value="*">Moltiplicazione (*)</option>
                    <option value="/">Divisione (/)</option>
                </select>

                <button onclick="calcola()" class="btn btn-success w-100">Calcola</button>

                <h4 class="text-center mt-3">Risultato: <span id="risultato"> 🤔🤔🤔🤔🤔🤔🤔 </span></h4>
            </div>
        </div>
        </div>
